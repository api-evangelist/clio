  updatedAt: DateTime!
}

"""The client portal configuration for a contact."""
type ClientPortal implements Node {
  id: ID!
  contact: Contact!
  enabled: Boolean!
  portalUrl: String
  lastLogin: DateTime
  sharedDocuments: [Document!]
  sharedBills: [Bill!]
