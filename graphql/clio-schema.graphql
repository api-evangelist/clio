# ─────────────────────────────────────────────
# Root types
# ─────────────────────────────────────────────

type Query {
  """The currently authenticated user."""
  me: User!

  """Retrieve a single matter by ID."""
  matter(id: ID!): Matter

  """List matters with optional filtering and pagination."""
  matters(filter: MatterFilter, page: Int, perPage: Int): MatterConnection!

  """Retrieve a single contact by ID."""
  contact(id: ID!): Contact

  """List contacts with optional filtering and pagination."""
  contacts(filter: ContactFilter, page: Int, perPage: Int): ContactConnection!

  """Retrieve a single user by ID."""
  user(id: ID!): User

  """List all users in the firm."""
  users(page: Int, perPage: Int): [User!]!

  """Retrieve a single document by ID."""
  document(id: ID!): Document

  """List documents with optional filtering and pagination."""
  documents(filter: DocumentFilter, page: Int, perPage: Int): DocumentConnection!

  """Retrieve a single time entry by ID."""
  timeEntry(id: ID!): TimeEntry

  """List time entries with optional filtering and pagination."""
  timeEntries(filter: TimeEntryFilter, page: Int, perPage: Int): TimeEntryConnection!

  """Retrieve a single bill by ID."""
  bill(id: ID!): Bill

  """List bills with optional filtering and pagination."""
  bills(filter: BillFilter, page: Int, perPage: Int): BillConnection!

  """Retrieve a single task by ID."""
  task(id: ID!): Task

  """List tasks with optional filtering and pagination."""
  tasks(filter: TaskFilter, page: Int, perPage: Int): TaskConnection!

  """Retrieve a single calendar entry by ID."""
  calendarEntry(id: ID!): CalendarEntry

  """List calendar entries."""
  calendarEntries(matterId: ID, startAfter: DateTime, endBefore: DateTime, page: Int, perPage: Int): [CalendarEntry!]!

  """Retrieve a single note by ID."""
  note(id: ID!): Note

  """List notes."""
  notes(matterId: ID, contactId: ID, page: Int, perPage: Int): [Note!]!

  """Retrieve a single trust account by ID."""
  trustAccount(id: ID!): TrustAccount

  """List trust accounts."""
  trustAccounts(page: Int, perPage: Int): [TrustAccount!]!

  """Retrieve trust balance for a matter/contact in a trust account."""
  trustBalance(trustAccountId: ID!, matterId: ID, contactId: ID): TrustBalance

  """Retrieve a single bank account by ID."""
  bankAccount(id: ID!): BankAccount

  """List operating bank accounts."""
  bankAccounts(page: Int, perPage: Int): [BankAccount!]!

  """Retrieve a single practice area by ID."""
  practiceArea(id: ID!): PracticeArea

  """List practice areas."""
  practiceAreas: [PracticeArea!]!

  """Retrieve a single custom field by ID."""
  customField(id: ID!): CustomField

  """List custom fields."""
  customFields(parentType: String): [CustomField!]!

  """Retrieve a single webhook by ID."""
  webhook(id: ID!): Webhook

  """List webhook subscriptions."""
  webhooks: [Webhook!]!

  """Retrieve a single report by ID."""
  report(id: ID!): Report

  """List generated reports."""
  reports(page: Int, perPage: Int): [Report!]!

  """Run a conflict check."""
  conflictCheck(query: String!, matterId: ID): ConflictCheck

  """Retrieve the firm."""
  firm: Firm!
}

type Mutation {
  createMatter(input: CreateMatterInput!): Matter!
  updateMatter(id: ID!, input: UpdateMatterInput!): Matter!
  deleteMatter(id: ID!): Boolean!

  createContact(input: CreateContactInput!): Contact!
  updateContact(id: ID!, input: UpdateContactInput!): Contact!
  deleteContact(id: ID!): Boolean!

  createTimeEntry(input: CreateTimeEntryInput!): TimeEntry!
  updateTimeEntry(id: ID!, input: UpdateTimeEntryInput!): TimeEntry!
  deleteTimeEntry(id: ID!): Boolean!

  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!

  createNote(input: CreateNoteInput!): Note!
  updateNote(id: ID!, input: UpdateNoteInput!): Note!
  deleteNote(id: ID!): Boolean!

  createDocument(input: CreateDocumentInput!): Document!
  deleteDocument(id: ID!): Boolean!

  createCalendarEntry(summary: String!, startAt: DateTime!, endAt: DateTime!, allDay: Boolean, matterId: ID, description: String): CalendarEntry!
  updateCalendarEntry(id: ID!, summary: String, startAt: DateTime, endAt: DateTime): CalendarEntry!
  deleteCalendarEntry(id: ID!): Boolean!

  createBill(input: CreateBillInput!): Bill!
  updateBill(id: ID!, status: BillStatusEnum): Bill!
  deleteBill(id: ID!): Boolean!

  createPayment(input: CreatePaymentInput!): Payment!
  deletePayment(id: ID!): Boolean!

  createWebhook(input: CreateWebhookInput!): Webhook!
  updateWebhook(id: ID!, input: UpdateWebhookInput!): Webhook!
  deleteWebhook(id: ID!): Boolean!
}
