  id: ID!
  name: String!
  description: String
  status: TaskStatusEnum!
  priority: String
  dueAt: DateTime
  completedAt: DateTime
  matter: Matter
  assignee: User
  assignor: User
  reminders: [Reminder!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""The status of a task."""
type TaskStatus implements Node {
  id: ID!
  name: String!
  status: TaskStatusEnum!
