"""
Clio Manage API v4 — Conceptual GraphQL Schema
Source: https://docs.developers.clio.com/api-docs/
REST base: https://app.clio.com/api/v4
Authentication: OAuth 2.0 Authorization Code Flow
"""

scalar DateTime
scalar Date
scalar JSON
scalar Decimal

# ─────────────────────────────────────────────
# Enumerations
# ─────────────────────────────────────────────

enum MatterStatusEnum {
  OPEN
  CLOSED
  PENDING
}

enum ContactTypeEnum {
  PERSON
  COMPANY
}

enum TaskStatusEnum {
  PENDING
  COMPLETE
}

enum ActivityTypeEnum {
  TIME_ENTRY
  EXPENSE
  FEE
}

enum BillStatusEnum {
  DRAFT
  AWAITING_APPROVAL
  APPROVED
  SENT
  PAID
  VOID
}

enum TrustTransactionTypeEnum {
  DEPOSIT
  WITHDRAWAL
  TRANSFER
}

enum BankTransactionTypeEnum {
  DEPOSIT
  WITHDRAWAL
}

enum WebhookStatusEnum {
  ACTIVE
  INACTIVE
}

enum CustomFieldTypeEnum {
  TEXT
  DATE
  NUMBER
  CHECKBOX
  PICKLIST
  CONTACT
  MATTER
  URL
  TEXTAREA
}

enum ESignatureStatusEnum {
  DRAFT
  SENT
  COMPLETED
  DECLINED
  VOIDED
}

enum CommunicationTypeEnum {
  EMAIL
  PHONE
  LETTER
}

enum DocumentCategoryEnum {
  GENERAL
  CORRESPONDENCE
  PLEADINGS
  DISCOVERY
  CONTRACTS
  CLOSING
}

# ─────────────────────────────────────────────
# Interfaces
# ─────────────────────────────────────────────

interface Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

interface Communication {
  id: ID!
  subject: String
  body: String
  date: DateTime
  matter: Matter
  sender: Contact
  recipients: [Contact!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

interface Account {
  id: ID!
  name: String!
  currency: String!
  balance: Decimal!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─────────────────────────────────────────────
# Firm and User types
# ─────────────────────────────────────────────

"""The law firm (top-level Clio account)."""
type Firm implements Node {
  id: ID!
  name: String!
  logoUrl: String
  currency: String!
  timeZone: String
  address: Address
  phone: String
  website: String
  users: [User!]
  practiceAreas: [PracticeArea!]
  customFields: [CustomField!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""An individual Clio user (attorney, paralegal, staff)."""
type User implements Node {
  id: ID!
  name: String!
  email: String!
  role: String
  enabled: Boolean!
  rate: Decimal
  profile: UserProfile
  firm: Firm!
  matters: [Matter!]
  timeEntries: [TimeEntry!]
  tasks: [Task!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Extended profile information for a user."""
type UserProfile implements Node {
  id: ID!
  user: User!
  firstName: String
  lastName: String
  initials: String
  phoneNumber: String
  bio: String
  avatarUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A practice (team or department) within the firm."""
type Practice implements Node {
  id: ID!
  name: String!
  firm: Firm!
  users: [User!]
  practiceAreas: [PracticeArea!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""An area of legal practice (e.g., Family Law, Corporate)."""
type PracticeArea implements Node {
  id: ID!
  name: String!
  code: String
  category: String
  practice: Practice
  matters: [Matter!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─────────────────────────────────────────────
# Matter types
# ─────────────────────────────────────────────

"""A legal matter (case or client engagement)."""
type Matter implements Node {
  id: ID!
  displayNumber: String!
  description: String
  status: MatterStatus!
  practiceArea: MatterPracticeArea
  client: Contact!
  responsibleAttorney: User
  originatingAttorney: User
  firm: Firm!
  openDate: Date
  closeDate: Date
  pendingDate: Date
  billable: Boolean!
  billingMethod: String
  contingencyFee: Decimal
  customRate: Decimal
  currency: String
  group: String
  notes: [Note!]
  tasks: [Task!]
  documents: [Document!]
  timeEntries: [TimeEntry!]
  expenses: [Expense!]
  bills: [Bill!]
  calendarEntries: [CalendarEntry!]
  communications: [EmailMessage!]
  relationships: [Relationship!]
  tags: [Tag!]
  customFieldValues: [CustomFieldValue!]
  originalMatter: OriginalMatter
  relatedMatters: [RelatedMatter!]
  splitBillingMatters: [RelatedMatter!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""The status of a matter."""
type MatterStatus implements Node {
  id: ID!
  name: String!
  status: MatterStatusEnum!
  color: String
  matters: [Matter!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A practice area assignment on a specific matter."""
type MatterPracticeArea implements Node {
  id: ID!
  matter: Matter!
  practiceArea: PracticeArea!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Reference to the original matter in a split or transferred matter."""
type OriginalMatter implements Node {
  id: ID!
  matter: Matter!
  originalMatter: Matter!
  transferDate: Date
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A link between two related matters."""
type RelatedMatter implements Node {
  id: ID!
  matter: Matter!
  relatedMatter: Matter!
  relationship: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A conflict check result for a matter or contact."""
type ConflictCheck implements Node {
  id: ID!
  query: String!
  status: String!
  results: JSON
  checkedBy: User
  checkedAt: DateTime
  matter: Matter
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─────────────────────────────────────────────
# Contact types
# ─────────────────────────────────────────────

"""A person or company in the Clio contact database."""
type Contact implements Node {
  id: ID!
  name: String!
  type: ContactTypeEnum!
  firstName: String
  middleName: String
  lastName: String
  prefix: String
  suffix: String
  title: String
  company: Contact
  email: String
  phone: String
  addresses: [Address!]
  relationships: [Relationship!]
  matters: [Matter!]
  notes: [Note!]
  tags: [Tag!]
  customFieldValues: [CustomFieldValue!]
  clioConnect: ClioConnect
