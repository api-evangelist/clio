  updatedAt: DateTime!
}

# ─────────────────────────────────────────────
# Calendar and Task types
# ─────────────────────────────────────────────

"""A calendar entry (appointment, court date, deadline)."""
type CalendarEntry implements Node {
  id: ID!
  summary: String!
