  updatedAt: DateTime!
}

"""A category label for documents."""
type DocumentCategory implements Node {
  id: ID!
  name: String!
  documents: [Document!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A versioned revision of a document."""
type DocumentVersion implements Node {
  id: ID!
  document: Document!
  versionNumber: Int!
  size: Int
  contentType: String
  filename: String
  createdBy: User
  downloadUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""An external web URL linked to a matter or contact."""
type WebLink implements Node {
  id: ID!
  name: String!
  url: String!
