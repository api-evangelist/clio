  responsibleAttorneyId: ID
  practiceAreaId: ID
  statusId: ID
  closeDate: Date
  billable: Boolean
}

input CreateContactInput {
  name: String!
  type: ContactTypeEnum!
  firstName: String
  lastName: String
  email: String
  phone: String
  companyId: ID
}

input UpdateContactInput {
  name: String
  firstName: String
  lastName: String
  email: String
  phone: String
}

input CreateTimeEntryInput {
  date: Date!
