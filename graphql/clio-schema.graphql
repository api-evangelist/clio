}

input TimeEntryFilter {
  matterId: ID
  userId: ID
  dateAfter: Date
  dateBefore: Date
  billable: Boolean
  billed: Boolean
}

input DocumentFilter {
  matterId: ID
  contactId: ID
  folderId: ID
  categoryId: ID
  query: String
}

input BillFilter {
  matterId: ID
  clientId: ID
  status: BillStatusEnum
