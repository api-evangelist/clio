  user: User!
  bill: Bill
  activityDescription: ActivityDescription
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""An expense charged to a matter."""
type Expense implements Node {
  id: ID!
  date: Date!
  quantity: Decimal!
