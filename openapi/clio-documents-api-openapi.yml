                            type: string
                            description: The ExternalProperty value.
                    filename:
                      type: string
                      default: name
                      description: Name of the original file.
                    multiparts:
                      type: array
                      items:
                        type: object
                        properties:
                          part_number:
                            type: integer
                            format: int32
                            description: 'The part number of multipart upload. It must be an integer between 1 to 10,000, inclusive.


                              Multipart upload supports upload a single file as a set of parts.

                              Each part is a contiguous portion of the data.

