        description: Request Body for Documents
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    communication_id:
                      type: integer
                      format: int64
                      description: Related communication record.
                    content_type:
                      type: string
                      description: A standard MIME type describing the format of the object data. If the field is not specified, it is determined by the file extension.
                    document_category:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single DocumentCategory associated with the Document. Use the keyword `null` to specify no association.
                    external_properties:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: 'The ExternalProperty name. Note: **there is a limit of 5 external_properties per Document**'
                          value:
                            type: string
                            description: The ExternalProperty value.
                    filename:
                      type: string
                      default: name
                      description: Name of the original file.
                    multiparts:
                      type: array
                      items:
                        type: object
                        properties:
                          part_number:
                            type: integer
                            format: int32
                            description: 'The part number of multipart upload. It must be an integer between 1 to 10,000, inclusive.


                              Multipart upload supports upload a single file as a set of parts.

                              Each part is a contiguous portion of the data.

                              A `part_number` uniquely identifies a part and also defines its position within the document being uploaded.

                              Each part must be at least 5 MB in size, except the last part.

                              There is no minimum size limit on the last part.


                              The URLs of multipart upload are returned in the field, `put_url`, with the corresponding `multipart`


                              The API handles maximum 50 `multiparts` in one request. If the upload is split to more than 50 parts,

                              make a PUT request with `fully_uploaded` equal to `false`, and another set of part numbers.

                              '
                          content_length:
                            type: string
                            description: The size of the part of the upload file in bytes.
                          content_md5:
                            type: string
                            description: The base64-encoded 128-bit MD5 digest of the part data. This header can be used as a message integrity check to verify that the part data is the same data that was originally sent. Although it is optional, we recommend using the Content-MD5 mechanism as an end-to-end integrity check.
                        required:
                        - part_number
                        - content_length
                    name:
                      type: string
                      description: Document name.
                    parent:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier of the parent object.
                        type:
                          type: string
