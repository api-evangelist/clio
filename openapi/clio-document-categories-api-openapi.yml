      requestBody:
        description: Request Body for Document Categories
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: What the DocumentCategory should be called.
          application/x-www-form-urlencoded:
            schema:
