tags:
- name: Rate Table Categories
  description: A rate table category is a column in a rate table, such as a timekeeper level, holding the rates for the timekeepers assigned to it. These endpoints add a category to a rate table, rename or reorder one, and remove one. Read categories through the Rate Tables endpoints, where they are nested under their table.
paths:
  /rate_table_categories.json:
    post:
      tags:
      - Rate Table Categories
      summary: Add a category to a rate table
      operationId: RateTableCategory#create
      description: Outlines the parameters and data fields used when creating a new RateTableCategory
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTableCategory_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Rate Table Categories
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the RateTableCategory. Must be unique within its Rate Table.
                    position:
                      type: integer
                      format: int64
                      description: 'Where the RateTableCategory goes in its Rate Table''s order, starting at 1. Categories at or after this position move down one. Default: the end of the list.'
                    rate_table:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single RateTable associated with the RateTableCategory. The keyword `null` is not valid for this field.
                      required:
                      - id
                  required:
                  - name
                  - rate_table
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the RateTableCategory. Must be unique within its Rate Table.
                    position:
                      type: integer
                      format: int64
                      description: 'Where the RateTableCategory goes in its Rate Table''s order, starting at 1. Categories at or after this position move down one. Default: the end of the list.'
                    rate_table:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single RateTable associated with the RateTableCategory. The keyword `null` is not valid for this field.
                      required:
                      - id
                  required:
                  - name
                  - rate_table
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the RateTableCategory. Must be unique within its Rate Table.
                    position:
                      type: integer
                      format: int64
                      description: 'Where the RateTableCategory goes in its Rate Table''s order, starting at 1. Categories at or after this position move down one. Default: the end of the list.'
                    rate_table:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single RateTable associated with the RateTableCategory. The keyword `null` is not valid for this field.
                      required:
                      - id
                  required:
                  - name
                  - rate_table
        required: false
  /rate_table_categories/{id}.json:
    patch:
      tags:
      - Rate Table Categories
      summary: Rename or move a rate table category
      operationId: RateTableCategory#update
      description: Outlines the parameters and data fields used when updating a single RateTableCategory
      parameters:
      - name: IF-MATCH
        in: header
        description: The server will update the requested resource and send back a 200 status, but only if value in the header matches the existing resource's [ETag](#section/ETags).
        required: false
        schema:
          type: string
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier for the RateTableCategory.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTableCategory_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Precondition Failed
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Rate Table Categories
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the RateTableCategory. Must be unique within its Rate Table.
                    position:
                      type: integer
                      format: int64
                      description: 'Where the RateTableCategory goes in its Rate Table''s order, starting at 1. Categories at or after this position move down one. Default: the end of the list.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the RateTableCategory. Must be unique within its Rate Table.
                    position:
                      type: integer
                      format: int64
                      description: 'Where the RateTableCategory goes in its Rate Table''s order, starting at 1. Categories at or after this position move down one. Default: the end of the list.'
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the RateTableCategory. Must be unique within its Rate Table.
                    position:
                      type: integer
                      format: int64
                      description: 'Where the RateTableCategory goes in its Rate Table''s order, starting at 1. Categories at or after this position move down one. Default: the end of the list.'
        required: false
    delete:
      tags:
      - Rate Table Categories
      summary: Remove a rate table category
      operationId: RateTableCategory#destroy
      description: Removes a Rate Table category as of today. Every assignment of it to a Matter or Contact is removed; those Matters and Contacts fall back to their next rate source. Rates in effect today end yesterday, and later rates are deleted. A category that still has past rates is hidden but kept for history; one with no rates is deleted. This can't be undone.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier for the RateTableCategory.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    RateTableCategory_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/RateTableCategory'
    RateTableCategory:
      allOf:
      - $ref: '#/components/schemas/RateTableCategory_base'
      - type: object
        properties: {}
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    RateTableCategory_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *RateTableCategory*
        etag:
          type: string
          description: ETag for the *RateTableCategory*
        name:
          type: string
          description: The name of the rate table category
        position:
          type: integer
          format: int64
          description: The position of the category within its rate table, used for display ordering
        created_at:
          type: string
          format: date-time
          description: The time the *RateTableCategory* was created (as a ISO-8601 timestamp)
        updated_at:
          type: string
          format: date-time
          description: The time the *RateTableCategory* was last updated (as a ISO-8601 timestamp)
