        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Damages
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    amount:
                      type: number
                      format: double
                      description: Amount
                    damage_type:
                      type: string
                      enum:
                      - special
                      - general
                      - other
                      description: Damage type
                    description:
                      type: string
                      description: Description
                    matter_id:
                      type: integer
                      format: int64
                      description: The unique identifier of the Matter to which the Damage is associated.
                  required:
                  - amount
                  - damage_type
                  - description
                  - matter_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    amount:
                      type: number
