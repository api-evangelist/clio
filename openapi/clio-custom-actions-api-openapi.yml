tags:
- name: Custom Actions
  description: 'In Clio, applications can create custom actions in our interface. Links are unique across an application, user, location in the UI (`ui_reference`) and label. When the user clicks on a custom action, Clio will open a new browser tab at the `target_url`.


    Clio will add a few URL parameters to the `target_url`, including the custom action ID, the ID of the user who clicked the link and the URL of the object(s) which the link was clicked on. The third party application must then look up the relevant OAuth token associated with the user and custom action, and make an authenticated request to the `subject_url`. This request both lets you validate the request was made by who you expected, that they have access to the record and lets you pull down any extra information you may need.


    Currently supported for: Activities, Contacts, Documents and Matters


    ## Security


    ### Confirming a User''s Action


    As custom actions require an unauthorized GET request, which can be faked, Clio has provided a way to validate that a user has actually performed an action.


    When a request is sent to the URL specified on the custom action, we will include a `custom_action_nonce` parameter. If you send us back the `custom_action_nonce` in your next request to the API, Clio will use it to validate that the user who clicked the custom action matches your oauth token request. If no match is made, an error will be returned.'
paths:
  /custom_actions.json:
    get:
      tags:
      - Custom Actions
      summary: Return the data for all CustomActions
      operationId: CustomAction#index
      description: Outlines the parameters, optional and required, used when requesting the data for all CustomActions
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: created_since
        in: query
        description: Filter CustomAction records to those having the `created_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: ids[]
        in: query
        description: Filter CustomAction records to those having the specified unique identifiers.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 'A limit on the number of CustomAction records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: updated_since
        in: query
        description: Filter CustomAction records to those having the `updated_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomAction_List'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Custom Actions
      summary: Create a new CustomAction
      operationId: CustomAction#create
      description: Outlines the parameters and data fields used when creating a new CustomAction
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomAction_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Custom Actions
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    label:
                      type: string
                      description: Text label to be displayed on the custom link.
                    target_url:
                      type: string
                      description: Target URL which will be opened in a new tab when the user clicks the custom link.
                    ui_reference:
                      type: string
                      enum:
                      - activities/show
                      - documents/show
                      - contacts/show
                      - matters/show
                      - folders/show
                      description: UI reference location within Clio where the link will be displayed.
                  required:
                  - label
                  - target_url
                  - ui_reference
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    label:
                      type: string
                      description: Text label to be displayed on the custom link.
                    target_url:
                      type: string
                      description: Target URL which will be opened in a new tab when the user clicks the custom link.
                    ui_reference:
                      type: string
                      enum:
                      - activities/show
                      - documents/show
                      - contacts/show
                      - matters/show
                      - folders/show
                      description: UI reference location within Clio where the link will be displayed.
                  required:
                  - label
                  - target_url
                  - ui_reference
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    label:
                      type: string
                      description: Text label to be displayed on the custom link.
                    target_url:
                      type: string
                      description: Target URL which will be opened in a new tab when the user clicks the custom link.
                    ui_reference:
                      type: string
                      enum:
                      - activities/show
                      - documents/show
                      - contacts/show
                      - matters/show
                      - folders/show
                      description: UI reference location within Clio where the link will be displayed.
                  required:
                  - label
                  - target_url
                  - ui_reference
        required: false
