      requestBody:
        description: Request Body for Packets
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    contact_id:
                      type: integer
                      format: int64
                      description: The unique identifier of the contact the packet is held on behalf of.
                    created_on:
                      type: string
                      format: date
                      description: The date the packet was created (ISO-8601). Defaults to the current date on creation.
                    custom_number:
                      type: string
                      description: An optional secondary identifier for the packet, shown alongside the system-assigned number.
                    description:
                      type: string
                      description: Free-text description of the packet.
