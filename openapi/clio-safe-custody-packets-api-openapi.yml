      properties:
        data:
          $ref: '#/components/schemas/SafeCustodyPacket'
    SafeCustodyPacket_base:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: The time the *SafeCustodyPacket* was created (as a ISO-8601 timestamp)
        created_on:
          type: string
          format: date
          description: The date the *SafeCustodyPacket* was created (as an ISO-8601 date)
        custom_number:
          type: string
          description: An optional secondary identifier for the *SafeCustodyPacket*, shown alongside its system-assigned number
        description:
          type: string
          description: Free-text description of the *SafeCustodyPacket*
        etag:
          type: string
          description: ETag for the *SafeCustodyPacket*
        id:
          type: integer
          format: int64
          description: Unique identifier for the *SafeCustodyPacket*
        number:
          type: string
          description: The unique, system-assigned number for the *SafeCustodyPacket* within the account
        updated_at:
          type: string
          format: date-time
          description: The time the *SafeCustodyPacket* was last updated (as a ISO-8601 timestamp)
    Error:
