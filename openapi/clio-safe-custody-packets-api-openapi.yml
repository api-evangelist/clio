          description: Detailed message about the error
    SafeCustodyPacket:
      allOf:
      - $ref: '#/components/schemas/SafeCustodyPacket_base'
      - type: object
        properties:
          contact:
            $ref: '#/components/schemas/SafeCustodyPacket_Contact_base'
            description: Contact
          location:
