                    secondary_taxable:
                      type: boolean
                      description: Whether the LineItem is secondary taxable.
                    tax_settings:
                      type: array
                      items:
                        type: object
                        properties:
                          tax_rate_configuration_id:
                            type: integer
                            format: int64
                            description: The unique identifier of the tax rate configuration associated with the tax setting.
                          order:
