                            description: The order that the tax setting should be applied in.
                          rule:
                            type: string
                            enum:
                            - Pre
                            - Post
                            description: The rule that the tax setting should be applied in.
                      description: Array of objects, with each object representing a tax setting with 'tax_rate_configuration_id', 'order', and 'rule' properties.
                    taxable:
                      type: boolean
                      description: Whether the LineItem taxable.
                    update_original_record:
                      type: boolean
                      description: Whether the associated activity will be updated.
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
