              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Bank Accounts
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    account_number:
                      type: string
                      description: 'Account number for the BankAccount.


                        When Compliant Trust Accounting is enabled, this field is required for operating accounts and controlled trust accounts.

                        '
                    balance:
                      type: number
                      format: double
                      description: BankAccount balance.
                    client:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: 'The unique identifier for the client associated with a controlled BankAccount.


                            When Compliant Trust Accounting is enabled and creating a controlled bank account, this field is required and cannot be updated after the account is created.

                            '
                    controlled_account:
                      type: boolean
                      description: 'Whether this BankAccount is a controlled bank account (Controlled Money Account / Interest Bearing Deposit).


                        When Compliant Trust Accounting is enabled, controlled bank accounts must be of type "Trust" and require bank name, client, and matter details. Client and matter cannot be updated after the account is created.

                        '
                    currency:
                      type: string
                      description: Currency the BankAccount is in.
                    default_account:
                      type: boolean
                      description: Whether or not the BankAccount should be the default account.
                    domicile_branch:
                      type: string
                      description: Branch where the BankAccount was opened.
                    general_ledger_number:
                      type: string
                      description: General ledger number used for the Law Society of Alberta.
                    holder:
                      type: string
                      description: BankAccount holder.
                    institution:
                      type: string
                      description: 'Financial institution (bank name).


                        When Compliant Trust Accounting is enabled and the BankAccount is controlled, this field is required.

                        '
                    matter:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: 'The unique identifier for the matter associated with a controlled BankAccount.


                            When Compliant Trust Accounting is enabled and creating a controlled bank account, this field is required and the matter must belong to the same client specified in `client[id]`. This association cannot be updated after the account is created.

                            '
                    name:
                      type: string
                      description: BankAccount name.
                    swift:
                      type: string
                      description: Identification code for the financial institution.
                    transit_number:
                      type: string
                      description: 'Transit number for the BankAccount branch.


                        When Compliant Trust Accounting is enabled, this field is required for operating accounts.

                        '
                    type:
                      type: string
                      enum:
                      - Operating
                      - Trust
                      description: Type of BankAccount.
                  required:
                  - currency
                  - type
