tags:
- name: Report Presets
  description: 'Report Presets can be created to streamline report generation workflow by saving report option parameters as a Preset.


    Support Link


    ## Creating a Report Preset

    ### Options

    When creating a Report Preset, the options sent in the request body is dependent on the report kind.


    Check out the sample request to create a Report Preset for the Billing History web report for the current year and grouped by client.


    ```

    Request

    POST /api/v4/report_presets.json

    {

    data:

    { name: "Current Yr Billing",

    kind: "billing_history",

    options: {

    date_range: "year",

    format: "html",

    group_by: "client",

    start_date: null,

    end_date: null,

    kind: "billing_history"

    },

    format: "html"

    }

    }

    ```'
paths:
  /report_presets/{id}/generate_report.json:
    post:
      tags:
      - Report Presets
      summary: Generate a new report for a given preset
      operationId: ReportPreset#generate_report
      parameters:
      - name: id
        in: path
        description: The unique identifier for the ReportPreset.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Report_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
