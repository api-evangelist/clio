        options:
          type: string
          description: The report options parameters
        disabled:
          type: boolean
          description: Whether the preset is currently disabled for the account (true when the preset's report kind is no longer available, e.g. after the trust compliance migration)
        disabled_reason:
          type: string
          description: A token indicating why the preset is disabled, or null when the preset is available. Possible values are "trust_compliance_enabled" (post-trust-compliance migration) and "legal_aid_account" (US legal-aid accounts).
