tags:
- name: Rate Table Assignments
  description: A rate table assignment links a Matter or Contact to a rate table category, so time logged against it is priced from that category's rates. This read-only endpoint lists the assignments for the Matters and Contacts visible to the current user, newest first. Pass `meta[assignment_counts]=true` to also receive the number of Matters and Contacts assigned, ignoring the `assignable_type` filter. Assignments are created, changed and removed through the Matter and Contact endpoints.
paths:
  /rate_table_assignments.json:
    get:
      tags:
      - Rate Table Assignments
      summary: Return the rate table assignments visible to the current user
      operationId: RateTableAssignment#index
      description: Outlines the parameters, optional and required, used when requesting the data for all RateTableAssignments
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: assignable_type
        in: query
        description: Filter RateTableAssignment records to those assigned to a given type of record. One of `Matter` or `Contact`.
        required: false
        schema:
          type: string
          enum:
          - Matter
          - Contact
      - name: created_since
        in: query
        description: Filter RateTableAssignment records to those having the `created_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: ids[]
        in: query
        description: Filter RateTableAssignment records to those having the specified unique identifiers.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 'A limit on the number of RateTableAssignment records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        description: 'Orders the RateTableAssignment records by the given field. Default: `id(desc)`.'
        required: false
        schema:
          type: string
          enum:
          - id(asc)
          - id(desc)
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: rate_table_category_id
        in: query
        description: Filter RateTableAssignment records to those in a specific Rate Table category.
        required: false
        schema:
          type: integer
          format: int64
      - name: rate_table_id
        in: query
        description: Filter RateTableAssignment records to those on a specific Rate Table.
        required: false
        schema:
          type: integer
          format: int64
      - name: updated_since
        in: query
        description: Filter RateTableAssignment records to those having the `updated_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTableAssignment_List'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    RateTableAssignment_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *RateTableAssignment*
        etag:
          type: string
          description: ETag for the *RateTableAssignment*
        rate_table_id:
          type: integer
          format: int64
          description: The unique identifier of the rate table assigned to the Matter or Contact
        rate_table_category_id:
          type: integer
          format: int64
          description: The unique identifier of the rate table category assigned to the Matter or Contact
        rate_table_name:
          type: string
          description: The name of the rate table assigned to the Matter or Contact
        rate_table_category_name:
          type: string
          description: The name of the rate table category assigned to the Matter or Contact
        assignable_id:
          type: integer
          format: int64
          description: The unique identifier of the Matter or Contact the rate table assignment belongs to
        assignable_type:
          type: string
          description: The type of record the rate table assignment belongs to. Can be either "Matter" or "Contact"
        created_at:
          type: string
          format: date-time
          description: The time the *RateTableAssignment* was created (as a ISO-8601 timestamp)
        updated_at:
          type: string
          format: date-time
          description: The time the *RateTableAssignment* was last updated (as a ISO-8601 timestamp)
    RateTableAssignment:
      allOf:
      - $ref: '#/components/schemas/RateTableAssignment_base'
      - type: object
        properties: {}
    RateTableAssignment_List:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: RateTableAssignment List Response
          items:
            $ref: '#/components/schemas/RateTableAssignment'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
