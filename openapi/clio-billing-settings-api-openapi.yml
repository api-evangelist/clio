paths:
  /settings/billing.json:
    get:
      tags:
      - Billing Settings
      summary: Return the billing settings
      operationId: BillingSetting#show
      description: Outlines the parameters, optional and required, used when requesting the data for a single BillingSetting
      parameters:
      - name: IF-MODIFIED-SINCE
        in: header
        description: The server will send the requested resource with a 200 status, but only if it has been modified after the given date. (Expects an RFC 2822 timestamp).
        required: false
        schema:
          type: string
          format: date
      - name: IF-NONE-MATCH
        in: header
        description: The server will send the requested resource with a 200 status, but only if the existing resource's [ETag](#section/ETags) doesn't match any of the values listed.
        required: false
        schema:
          type: string
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: duration
        in: query
        description: 'Duration string for time rounding, conforming to the Chronic date parser. For example: ''3h'' or ''2:15''.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/BillingSetting_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '304':
          description: Not Modified
components:
  schemas:
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    BillingSetting:
      allOf:
      - $ref: '#/components/schemas/BillingSetting_base'
      - type: object
        properties:
          tax_settings:
            type: array
            items:
              $ref: '#/components/schemas/TaxSetting_base'
            description: TaxSetting
    BillingSetting_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *BillingSetting*
        etag:
          type: string
          description: ETag for the *BillingSetting*
        rounded_duration:
          type: number
          format: float
          description: Rounded equivalent of duration submitted
        rounding:
          type: integer
          format: int32
          description: Minute increment for time rounding
        use_decimal_rounding:
          type: boolean
          description: Round time to two decimal places
        currency:
          type: string
          description: Current user setting of currency
        currency_sign:
          type: string
          description: The sign of the current currency
        tax_rate:
          type: number
          format: double
          description: Rate applied for primary tax on invoices using this BillingSetting
        tax_name:
          type: string
          description: Name shown for primary tax on invoices using this BillingSetting
        apply_tax_by_default:
          type: boolean
          description: Used to determine if primary tax should be applied to invoices by default
        apply_secondary_tax_by_default:
          type: boolean
          description: Used to determine if secondary tax should be applied to invoices by default
        time_on_flat_rate_contingency_matters_is_non_billable:
          type: boolean
          description: Used to determine if hourly time entries on fixed fee or contingency fee matters should be non-billable by default
        use_secondary_tax:
          type: boolean
          description: Used to determine if secondary tax applies to invoices using this BillingSetting
        secondary_tax_rate:
          type: number
          format: double
          description: Rate applied for secondary tax on invoices using this BillingSetting
        secondary_tax_rule:
          type: string
          enum:
          - Pre
          - Post
          description: Used to determine if secondary tax should be applied separately or additionally to primary tax
        secondary_tax_name:
          type: string
          description: Name shown for secondary tax on invoices using this BillingSetting
        notify_after_bill_created:
          type: boolean
          description: Flag to indicate if users should have the option to notify other users when generating a bill
        use_utbms_codes:
          type: boolean
          description: Controls usage of UTBMS codes, allowing creation of coded time entries and expenses
        created_at:
          type: string
          format: date-time
          description: The time the *BillingSetting* was created (as a ISO-8601 timestamp)
        updated_at:
          type: string
          format: date-time
          description: The time the *BillingSetting* was last updated (as a ISO-8601 timestamp)
        multi_currency_billing:
          type: boolean
          description: Whether multi-currency billing is enabled
        billing_currencies:
          type: array
          items:
            type: object
          description: The currencies that an account has available for billing, if multi-currency billing is enabled
        tax_settings:
          type: array
          items:
            type: object
          description: Array of objects representing invoice tax defaults, with each object containing 'tax_rate_configuration_id', 'order', and 'rule'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    BillingSetting_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/BillingSetting'
    TaxSetting_base:
      type: object
      properties:
        tax_rate_configuration_id:
          type: integer
          format: int64
          description: The unique identifier of the tax rate configuration associated with the tax setting
        tax_rate_configuration_name:
          type: string
          description: The name of the tax rate configuration
        tax_rate_configuration_rate:
          type: number
          format: decimal
          description: The rate of the tax rate configuration
        tax_rate_configuration_formatted_rate:
          type: string
          description: The formatted rate of the tax rate configuration as a percentage
        order:
          type: integer
          format: int32
          description: The order in which this tax setting should be applied
        rule:
          type: string
          description: The rule that the tax setting should be applied in
