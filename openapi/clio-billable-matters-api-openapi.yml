          *Multiple conditions for the same custom field:*


          If you want to use more than one operator to filter a custom field, you can do so by passing in an array of values.

          e.g. `?custom_field_values[1]=[<=50, >=45]`

          '
        required: false
        schema:
          type: string
          enum:
          - '='
          - <
          - '>'
          - <=
          - '>='
      - name: end_date
        in: query
        description: Filter BillableMatter records to those that have matters with unbilled activities on or before this date (Expects an ISO-8601 date).
        required: false
        schema:
          type: string
