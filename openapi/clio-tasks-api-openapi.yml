    patch:
      tags:
      - Tasks
      summary: Update a single Task
      operationId: Task#update
      description: 'Outlines the parameters and data fields used when updating a single Task


        A Task can be assigned to up to 10 firm users, or to one Contact, but never both.


        - Send `assignees` to set the firm-user set. The list replaces the existing assignees rather than adding to them. The response order may differ from the order submitted.

        - Send `assignee` (with both `id` and `type`) to assign a single User or Contact. Sending it to a Task that currently has several assignees collapses the set down to that one assignee.

        - The two are mutually exclusive: sending both is rejected, and so is an empty `assignees` list.

        - Reading back: `assignees` lists the firm users the Task is assigned to, and `assignee` is one of them. `assignees` is `[]` in every other case, including a Contact assignee. An unassigned Task returns `assignee` as `null` and `assignees` as `[]`.'
