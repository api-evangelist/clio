- url: https://app.clio.com/api/v4
  description: US region Production Server
- url: https://eu.app.clio.com/api/v4
  description: Europe region Production Server
- url: https://ca.app.clio.com/api/v4
  description: Canada region Production Server
- url: https://au.app.clio.com/api/v4
  description: Australia region Production Server
tags:
- name: Tasks
  description: 'Tasks are used to assign and track work. Users can set priorities, due dates, and add reminders.


    Tasks can be assigned to firm users as well as Contacts (such as clients or co-counsel).


    Support Link


    Tasks in Clio'
paths:
  /tasks.json:
    get:
      tags:
      - Tasks
      summary: Return the data for all Tasks
      operationId: Task#index
      description: 'Outlines the parameters, optional and required, used when requesting the data for all Tasks


        A Task can be assigned to up to 10 firm users, or to one Contact, but never both.


        `assignees` lists the firm users the Task is assigned to, and `assignee` is one of them. `assignees` is `[]` in every other case, including a Contact assignee. An unassigned Task returns `assignee` as `null` and `assignees` as `[]`.'
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: assignee_contact_ids[]
        in: query
        description: Filter Task records to those assigned to any of the given contacts. Repeat the parameter once per id.
        required: false
        schema:
          type: integer
          format: int64
      - name: assignee_id
        in: query
        description: The unique identifier for a single User or Contact. Use the keyword `null` to match those without a Task. The list will be filtered to include only the Task records with the matching property.
        required: false
        schema:
          type: integer
          format: int64
      - name: assignee_ids[]
        in: query
        description: Filter Task records to those assigned to any of the given firm users. Matches secondary assignees as well as the primary one. Repeat the parameter once per id.
        required: false
        schema:
          type: integer
          format: int64
      - name: assignee_type
        in: query
        description: Filter Task records to those with a specific assignee. Must be passed if filtering by assignee.
        required: false
        schema:
          type: string
          enum:
          - user
          - contact
      - name: assignee_types[]
        in: query
        description: 'Filter Task records to those with any of the given assignee types. Optional: broadens an `assignee_ids` filter to include all firm users or all contacts. When `user` is present it matches all firm-user-assigned tasks regardless of specific ids. Cannot be combined with the singular `assignee_type`.'
        required: false
        schema:
          type: string
          enum:
          - user
          - contact
      - name: assigner_id
        in: query
        description: The unique identifier for a single User. Use the keyword `null` to match those without a Task. The list will be filtered to include only the Task records with the matching property.
        required: false
        schema:
          type: integer
          format: int64
      - name: cascading_source_id
        in: query
        description: Filter Task records to those with a parent task that has the specified ID.
        required: false
        schema:
          type: integer
          format: int32
      - name: client_id
        in: query
        description: The unique identifier for a single Contact. Use the keyword `null` to match those without a Task. The list will be filtered to include only the Task records with the matching property.
        required: false
        schema:
          type: integer
          format: int64
      - name: complete
        in: query
        description: Filter Task records to those which are complete or not.
        required: false
        schema:
          type: boolean
      - name: created_since
        in: query
        description: Filter Task records to those having the `created_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      - name: due_at_from
        in: query
        description: Start of date range when querying by due_at in a range. (Expects an ISO-8601 date).
        required: false
        schema:
          type: string
          format: date
      - name: due_at_present
        in: query
        description: Filter Task records to those that have a due date specified, or not.
        required: false
        schema:
          type: boolean
      - name: due_at_to
        in: query
        description: End of date range when querying by due_at in a range. (Expects an ISO-8601 date).
        required: false
        schema:
          type: string
          format: date
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: ids[]
        in: query
        description: Filter Task records to those having the specified unique identifiers.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 'A limit on the number of Task records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: matter_id
        in: query
        description: The unique identifier for a single Matter. Use the keyword `null` to match those without a Task. The list will be filtered to include only the Task records with the matching property.
        required: false
        schema:
          type: integer
          format: int64
      - name: order
        in: query
        description: 'Orders the Task records by the given field. Default: `id(asc)`.'
        required: false
        schema:
          type: string
          enum:
          - name(asc)
          - name(desc)
          - task_type.name(asc)
          - task_type.name(desc)
          - id(asc)
          - id(desc)
          - priority(asc)
          - priority(desc)
          - matter.display_number(asc)
          - matter.display_number(desc)
          - due_at(asc)
          - due_at(desc)
          - due_at_strict(asc)
          - due_at_strict(desc)
          - completed_at(asc)
          - completed_at(desc)
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: permission
        in: query
        description: Filter Task records to those with the given permission. Returns all tasks by default.
        required: false
        schema:
          type: string
          enum:
          - private
          - public
      - name: priorities[]
        in: query
        description: Filter Task records to those with any of the given priorities. Repeat the parameter once per priority.
        required: false
        schema:
          type: string
          enum:
          - high
          - normal
          - low
      - name: priority
        in: query
        description: Filter Task records to those with the given priority.
        required: false
        schema:
          type: string
          enum:
          - high
          - normal
          - low
      - name: query
        in: query
        description: Wildcard search for `name` or `description` matching a given string.
        required: false
        schema:
          type: string
      - name: responsible_attorney_id
        in: query
        description: Filter Task records to those that have an associated matter with a responsible attorney ID.
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        description: Filter Task records to those with the given status. Users without advanced tasks enabled may only specify 'complete' or 'pending'.
        required: false
        schema:
          type: string
          enum:
          - pending
          - in_progress
          - in_review
          - complete
          - draft
      - name: statuses[]
        in: query
        description: Filter Task records to those with the given statuses. Users without advanced tasks enabled may only specify 'complete' or 'pending'.
        required: false
        schema:
          type: string
          enum:
          - pending
          - in_progress
          - in_review
          - complete
          - draft
      - name: statute_of_limitations
        in: query
        description: Filter Task records to those which are a statute of limitations or not.
        required: false
        schema:
          type: boolean
      - name: task_type_id
        in: query
        description: The unique identifier for a single TaskType. Use the keyword `null` to match those without a Task. The list will be filtered to include only the Task records with the matching property.
        required: false
        schema:
          type: integer
          format: int64
      - name: time_entries_present
        in: query
        description: Filter Task records to those that have associated time entries, or not.
        required: false
        schema:
          type: boolean
      - name: updated_since
        in: query
        description: Filter Task records to those having the `updated_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Task_List'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Tasks
      summary: Create a new Task
      operationId: Task#create
      description: 'Outlines the parameters and data fields used when creating a new Task


        A Task can be assigned to up to 10 firm users, or to one Contact, but never both.


        - Send `assignees` to set the firm-user set. The list replaces the existing assignees rather than adding to them. The response order may differ from the order submitted.

        - Send `assignee` (with both `id` and `type`) to assign a single User or Contact. Sending it to a Task that currently has several assignees collapses the set down to that one assignee.

        - The two are mutually exclusive: sending both is rejected, and so is an empty `assignees` list.

        - Reading back: `assignees` lists the firm users the Task is assigned to, and `assignee` is one of them. `assignees` is `[]` in every other case, including a Contact assignee. An unassigned Task returns `assignee` as `null` and `assignees` as `[]`.'
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Task_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Tasks
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    assignee:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single User or Contact to assign the Task to. The keyword `null` is not valid for this field. Both `id` and `type` are required when sending `assignee`. Provide either `assignee` or `assignees`, never both. Exactly one of the two is required when creating a Task.
                        type:
                          type: string
                          enum:
                          - User
                          - Contact
                          description: Model type of the assignee.
                    assignees:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                            description: The unique identifier for a firm user to assign the Task to. Send `assignees` to assign up to 10 firm users at once; the list replaces the existing assignees rather than adding to them. Contacts are not accepted here, use `assignee` instead. Mutually exclusive with `assignee`, and an empty list is rejected.
                    cascading:
                      type: boolean
                      description: Determines if the Task has a due date that is derived from another Task. (Note that if false, no other cascading information will be checked)
                    cascading_offset:
                      type: integer
                      format: int32
                      description: The amount of time that will differentiate the cascaded Task from its parent.
                    cascading_offset_polarity:
                      type: string
                      enum:
                      - CalendarDays
                      - CalendarWeeks
                      - CalendarMonths
                      - CalendarYears
                      - BusinessDays
                      description: Determines whether or not the cascading_offset occurs before or after its parent.
                    cascading_offset_type:
                      type: string
                      enum:
                      - Before
                      - After
                      description: Determines the quantity of the cascading offset (e.g. CalendarDays, CalendarWeeks etc.)
                    cascading_source:
                      type: integer
                      format: int32
                      description: The parent Task that is used to determine the due_at property of the cascaded Task
                    description:
                      type: string
                      description: Longer description of the Task. This Task supports rich text when the `description_text_type` field is set to `rich_text`. With supported tags such as `<a>`, `<b>`, `<br>`, `<div>`, `<em>`, `<i>` `<li>`, `<ol>`, `<p>`, `<s>`, `<strong>`, `<u>` and `<ul>`. This Task also supports attributes such as `href`, `rel`, `type`, and `target`.
                    description_text_type:
                      type: string
                      default: plain_text
                      enum:
                      - plain_text
                      - rich_text
                      description: The type of text in the description field.
                    due_at:
                      type: string
                      format: date-time
                      description: Date when the Task must be completed by. (Expects an ISO-8601 date).
                    matter:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single Matter associated with the Task. The keyword `null` is not valid for this field.
                    name:
                      type: string
                      description: Name of the Task.
                    notify_assignee:
                      type: boolean
                      description: Whether or not the Task should notify the assignee on creation.
                    notify_completion:
                      type: boolean
                      description: Whether or not the Task should notify the assigner on completion.
                    permission:
                      type: string
                      default: public
                      enum:
                      - private
                      - public
                      description: Permission of the Task. Defaults to `public`
                    priority:
                      type: string
                      default: Normal
                      enum:
                      - High
                      - Normal
                      - Low
                      description: Priority of the Task.
                    status:
                      type: string
                      default: pending
                      enum:
                      - pending
                      - in_progress
                      - in_review
                      - complete
                      - draft
                      description: Task status. Users without advanced tasks are allowed to select `Complete` or `Pending` only.
                    statute_of_limitations:
                      type: boolean
                      description: Whether or not the Task should be a statute of limitations.
                    task_type:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single TaskType associated with the Task. The keyword `null` is not valid for this field.
                    time_estimated:
                      type: integer
                      format: int32
                      description: Time the Task should take to complete.
                  required:
                  - name
                  - description
