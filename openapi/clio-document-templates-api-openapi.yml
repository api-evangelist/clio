          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    document_category:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single DocumentCategory associated with the DocumentTemplate. The keyword `null` is not valid for this field.
                    file:
                      type: string
                      description: 'A file that contains the DocumentTemplate. The file can be uploaded through a form as application/x-www-form-urlencoded or multipart/form-data request.

                        Alternatively, the file can be converted to a BASE64-encoded string and serialized to JSON.

                        '
                    filename:
                      type: string
                      description: The name of the file. The field is required when the file is BASE64-encoded string.
                  required:
