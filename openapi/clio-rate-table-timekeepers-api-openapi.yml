tags:
- name: Rate Table Timekeepers
  description: A timekeeper is a firm user who has rates on a rate table. These endpoints list the users on a rate table on a given date, add a user to a rate table, with a blank rate in every category from a given date, and remove a user from a date onward. Set their rates with the Rate Table Rates endpoint.
paths:
  /rate_table_timekeepers.json:
    get:
      tags:
      - Rate Table Timekeepers
      summary: Return the timekeepers on a rate table
      operationId: RateTableTimekeeper#index
      description: Returns the Users with a rate on the Rate Table in effect on `as_of_date`, ordered by User id. `as_of_date` defaults to today and can be any date, past or future. A User removed before that date, or scheduled to join after it, isn't listed. Archived tables can be listed.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: as_of_date
        in: query
        description: 'The date to apply, in YYYY-MM-DD format. Default: today. When listing, returns the users with a rate on the Rate Table in effect on this date, and can be any date. When removing, the user leaves the Rate Table on this date, which can''t be in the past.'
        required: false
        schema:
          type: string
          format: date
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'A limit on the number of RateTableTimekeeper records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        description: 'Orders the RateTableTimekeeper records by the given field. Default: `id(asc)`.'
        required: false
        schema:
          type: string
          enum:
          - id(asc)
          - id(desc)
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: rate_table_id
        in: query
        description: The unique identifier of the Rate Table.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTableTimekeeper_List'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Rate Table Timekeepers
      summary: Add a timekeeper to a rate table
      operationId: RateTableTimekeeper#create
      description: Adds a firm User to an active Rate Table as of `as_of_date`, with a blank rate in every category where the User has no rate on or after that date, so re-adding a User after a category is added fills in just that category. Set the rates with the Rate Table Rates endpoint. Fails if the table has no categories, or if the User already has a rate in every category on or after `as_of_date`.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTableTimekeeper_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Rate Table Timekeepers
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    as_of_date:
                      type: string
                      format: date
                      description: 'The date the user joins the Rate Table, in YYYY-MM-DD format. They get a blank rate in every category from this date. Can''t be in the past. Default: today.'
                    rate_table:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single RateTable associated with the RateTableTimekeeper. The keyword `null` is not valid for this field.
                      required:
                      - id
                    user:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single User associated with the RateTableTimekeeper. The keyword `null` is not valid for this field.
                      required:
                      - id
                  required:
                  - rate_table
                  - user
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    as_of_date:
                      type: string
                      format: date
                      description: 'The date the user joins the Rate Table, in YYYY-MM-DD format. They get a blank rate in every category from this date. Can''t be in the past. Default: today.'
                    rate_table:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single RateTable associated with the RateTableTimekeeper. The keyword `null` is not valid for this field.
                      required:
                      - id
                    user:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single User associated with the RateTableTimekeeper. The keyword `null` is not valid for this field.
                      required:
                      - id
                  required:
                  - rate_table
                  - user
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    as_of_date:
                      type: string
                      format: date
                      description: 'The date the user joins the Rate Table, in YYYY-MM-DD format. They get a blank rate in every category from this date. Can''t be in the past. Default: today.'
                    rate_table:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single RateTable associated with the RateTableTimekeeper. The keyword `null` is not valid for this field.
                      required:
                      - id
                    user:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: The unique identifier for a single User associated with the RateTableTimekeeper. The keyword `null` is not valid for this field.
                      required:
                      - id
                  required:
                  - rate_table
                  - user
        required: false
  /rate_table_timekeepers/{id}.json:
    delete:
      tags:
      - Rate Table Timekeepers
      summary: Remove a timekeeper from a rate table
      operationId: RateTableTimekeeper#destroy
      description: Removes a User from a Rate Table as of `as_of_date`. The `id` in the path is the User's id. Rates that started before that date and are still in effect end the day before, rates starting on or after it are deleted, and rates that already ended are left alone, so billed history is kept. `as_of_date` defaults to today and can't be in the past. Archived tables can't be changed.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: as_of_date
        in: query
        description: 'The date to apply, in YYYY-MM-DD format. Default: today. When listing, returns the users with a rate on the Rate Table in effect on this date, and can be any date. When removing, the user leaves the Rate Table on this date, which can''t be in the past.'
        required: false
        schema:
          type: string
          format: date
      - name: id
        in: path
        description: The unique identifier for the User to remove from the Rate Table.
        required: true
        schema:
          type: integer
          format: int64
      - name: rate_table_id
        in: query
        description: The unique identifier of the Rate Table.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    User_base:
      type: object
      properties:
        account_owner:
          type: boolean
          description: Whether the *User* is the owner of the account
        clio_connect:
          type: boolean
          description: Whether the *User* is a Clio Connect user
        court_rules_default_attendee:
          type: boolean
          description: Whether the *User* is a default attendee for court rules events
        created_at:
          type: string
          format: date-time
          description: The time the *User* was created (as a ISO-8601 timestamp)
        default_calendar_id:
          type: integer
          format: int64
          description: Default calendar id for *User*.
        email:
          type: string
          description: The email of the *User*
        enabled:
          type: boolean
          description: Whether the *User* is allowed to log in
        etag:
          type: string
          description: ETag for the *User*
        first_name:
          type: string
          description: The first name of the *User*
        id:
          type: integer
          format: int64
          description: Unique identifier for the *User*
        initials:
          type: string
          description: The initials of the *User*
        last_name:
          type: string
          description: The last name of the *User*
        name:
          type: string
          description: The full name of the *User*
        phone_number:
          type: string
          description: The primary phone number for the *User*.
        rate:
          type: number
          format: float
          description: Default user activity rate for *User*.
        roles:
          type: array
          items:
            type: string
          description: An array of roles assigned to this *User*
        subscription_type:
          type: string
          enum:
          - Attorney
          - NonAttorney
          description: The subscription type of the *User*
        time_zone:
          type: string
          description: The selected time zone of the *User*
        updated_at:
          type: string
          format: date-time
          description: The time the *User* was last updated (as a ISO-8601 timestamp)
        locale:
          type: string
          description: The locale of the *User*
    RateTableTimekeeper:
      allOf:
      - $ref: '#/components/schemas/RateTableTimekeeper_base'
      - type: object
        properties:
          rate_table:
            $ref: '#/components/schemas/RateTable_base'
            description: RateTable
          timekeeper:
            $ref: '#/components/schemas/User_base'
            description: User
          created_by_user:
            $ref: '#/components/schemas/User_base'
            description: User
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    RateTableTimekeeper_base:
      type: object
      properties:
        etag:
          type: string
          description: ETag for the *RateTableTimekeeper*
        rate_table_id:
          type: integer
          format: int64
          description: The unique identifier of the rate table the timekeeper was added to
        as_of_date:
          type: string
          format: date
          description: When adding a timekeeper, the date their blank rates start on the rate table. When listing timekeepers, the date the list is for
    RateTableTimekeeper_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/RateTableTimekeeper'
    RateTable_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *RateTable*
        etag:
          type: string
          description: ETag for the *RateTable*
        name:
          type: string
          description: The name of the rate table
        description:
          type: string
          description: A detailed description of the rate table
        currency_id:
          type: integer
          format: int64
          description: The ID of the currency the rate table's rates are denominated in
        status:
          type: string
          description: The status of the rate table. Can be either "active" or "archived"
        created_at:
          type: string
          format: date-time
          description: The time the *RateTable* was created (as a ISO-8601 timestamp)
        updated_at:
          type: string
          format: date-time
          description: The time the *RateTable* was last updated (as a ISO-8601 timestamp)
    RateTableTimekeeper_List:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: RateTableTimekeeper List Response
          items:
            $ref: '#/components/schemas/RateTableTimekeeper'
