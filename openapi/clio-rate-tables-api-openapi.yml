      requestBody:
        description: Request Body for Rate Tables
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency_id:
                      type: integer
                      format: int64
                      description: The unique identifier for the Currency the RateTable's rates are denominated in. Must be one of the account's billing currencies.
                    description:
