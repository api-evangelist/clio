        required: false
    delete:
      tags:
      - Rate Tables
      summary: Permanently delete a rate table
      operationId: RateTable#destroy
      description: 'Permanently deletes a Rate Table, whether it is active or archived. This removes:


        - the table''s categories and every rate in them

        - every assignment of the table to a Matter or Contact; those Matters fall back to their next rate source


        Existing activities keep the rate table and category names they were priced with.'
      parameters:
