        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '304':
          description: Not Modified
    patch:
      tags:
      - Rate Tables
      summary: Update a rate table
      operationId: RateTable#update
      description: Outlines the parameters and data fields used when updating a single RateTable
      parameters:
      - name: IF-MATCH
