tags:
- name: Rate Tables
  description: Rate tables let firms manage billing rates across multiple categories (levels) of timekeepers. A rate table has a single currency and a set of categories, each holding the rates for the timekeepers assigned to it. These endpoints list, create, update, archive, unarchive and delete rate tables. Listing excludes archived tables by default; request them with the `status` filter. Categories are managed with the Rate Table Categories endpoints, timekeepers are listed, added and removed with the Rate Table Timekeepers endpoints, and rates are set with the Rate Table Rates endpoint.
paths:
  /rate_tables/{id}/archive.json:
    patch:
      tags:
      - Rate Tables
      summary: Archive a rate table
      operationId: RateTable#archive
      description: Archives a Rate Table and permanently removes every assignment of it to a Matter or Contact; those Matters and Contacts fall back to their next rate source. Unarchiving does not restore the assignments. Archiving an already-archived table returns it unchanged.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier for the RateTable.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTable_Show'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
  /rate_tables/{id}/unarchive.json:
    patch:
      tags:
      - Rate Tables
      summary: Unarchive a rate table
      operationId: RateTable#unarchive
      description: Makes an archived Rate Table active again. Assignments removed when it was archived are not restored. Unarchiving an active table returns it unchanged.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier for the RateTable.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTable_Show'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
  /rate_tables.json:
    get:
      tags:
      - Rate Tables
      summary: Return the rate tables visible to the current user
      operationId: RateTable#index
      description: Outlines the parameters, optional and required, used when requesting the data for all RateTables
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: created_since
        in: query
        description: Filter RateTable records to those having the `created_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      - name: currency_id
        in: query
        description: Filter RateTable records to those of a specific currency.
        required: false
        schema:
          type: integer
          format: int64
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: ids[]
        in: query
        description: Filter RateTable records to those having the specified unique identifiers.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 'A limit on the number of RateTable records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        description: 'Orders the RateTable records by the given field. Default: `name(asc)`.'
        required: false
        schema:
          type: string
          enum:
          - id(asc)
          - id(desc)
          - name(asc)
          - name(desc)
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter RateTable records to those with the given status. One of `active` or `archived`.
        required: false
        schema:
          type: string
          enum:
          - active
          - archived
      - name: updated_since
        in: query
        description: Filter RateTable records to those having the `updated_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTable_List'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Rate Tables
      summary: Create a new rate table
      operationId: RateTable#create
      description: Outlines the parameters and data fields used when creating a new RateTable
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/RateTable_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Rate Tables
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency_id:
                      type: integer
                      format: int64
                      description: The unique identifier for the Currency the RateTable's rates are denominated in. Must be one of the account's billing currencies.
                    description:
                      type: string
                      description: A detailed description of the RateTable.
                    name:
                      type: string
                      description: Name of the RateTable. Must be unique within the account.
                  required:
                  - name
                  - currency_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency_id:
                      type: integer
                      format: int64
                      description: The unique identifier for the Currency the RateTable's rates are denominated in. Must be one of the account's billing currencies.
                    description:
                      type: string
                      description: A detailed description of the RateTable.
                    name:
                      type: string
                      description: Name of the RateTable. Must be unique within the account.
                  required:
                  - name
                  - currency_id
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency_id:
                      type: integer
                      format: int64
                      description: The unique identifier for the Currency the RateTable's rates are denominated in. Must be one of the account's billing currencies.
                    description:
                      type: string
                      description: A detailed description of the RateTable.
                    name:
                      type: string
                      description: Name of the RateTable. Must be unique within the account.
                  required:
                  - name
                  - currency_id
        required: false
  /rate_tables/{id}.json:
    get:
      tags:
      - Rate Tables
      summary: Return a single rate table
      operationId: RateTable#show
      description: Outlines the parameters, optional and required, used when requesting the data for a single RateTable
      parameters:
      - name: IF-MODIFIED-SINCE
        in: header
        description: The server will send the requested resource with a 200 status, but only if it has been modified after the given date. (Expects an RFC 2822 timestamp).
        required: false
        schema:
          type: string
          format: date
      - name: IF-NONE-MATCH
        in: header
        description: The server will send the requested resource with a 200 status, but only if the existing resource's [ETag](#section/ETags) doesn't match any of the values listed.
        required: false
