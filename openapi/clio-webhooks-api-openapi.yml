            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Webhooks
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    events:
                      type: array
                      items:
                        type: string
                        enum:
                        - created
                        - updated
                        - deleted
                        - matter_opened
                        - matter_pended
                        - matter_closed
                      description: The events your webhook is subscribed to.
                    expires_at:
                      type: string
                      format: date-time
                      description: The date and time when the Webhook will expire. (Expects an ISO-8601 timestamp).
                    fields:
                      type: string
                      description: Fields to be included in the Webhook request.
                    model:
                      type: string
                      enum:
                      - activity
                      - bill
                      - calendar_entry
                      - clio_payments_payment
                      - communication
                      - contact
                      - document
                      - folder
                      - matter
                      - task
                      description: What model the Webhook is for. This field accepts either [the string identifier of the model or its ID](#section/Supported-Models)
                    url:
                      type: string
                      description: The URL of where to POST the Webhook. Note that only URLs using the `https` protocol will be accepted.
                  required:
                  - url
                  - model
                  - fields
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    events:
                      type: array
                      items:
                        type: string
                        enum:
                        - created
                        - updated
                        - deleted
                        - matter_opened
                        - matter_pended
                        - matter_closed
                      description: The events your webhook is subscribed to.
                    expires_at:
                      type: string
                      format: date-time
                      description: The date and time when the Webhook will expire. (Expects an ISO-8601 timestamp).
                    fields:
                      type: string
                      description: Fields to be included in the Webhook request.
                    model:
                      type: string
                      enum:
                      - activity
                      - bill
                      - calendar_entry
                      - clio_payments_payment
                      - communication
                      - contact
                      - document
                      - folder
                      - matter
                      - task
                      description: What model the Webhook is for. This field accepts either [the string identifier of the model or its ID](#section/Supported-Models)
                    url:
                      type: string
                      description: The URL of where to POST the Webhook. Note that only URLs using the `https` protocol will be accepted.
                  required:
                  - url
                  - model
                  - fields
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    events:
                      type: array
                      items:
                        type: string
                        enum:
                        - created
                        - updated
                        - deleted
                        - matter_opened
                        - matter_pended
                        - matter_closed
                      description: The events your webhook is subscribed to.
                    expires_at:
                      type: string
                      format: date-time
                      description: The date and time when the Webhook will expire. (Expects an ISO-8601 timestamp).
                    fields:
                      type: string
                      description: Fields to be included in the Webhook request.
                    model:
                      type: string
                      enum:
                      - activity
                      - bill
                      - calendar_entry
                      - clio_payments_payment
                      - communication
                      - contact
                      - document
                      - folder
                      - matter
                      - task
                      description: What model the Webhook is for. This field accepts either [the string identifier of the model or its ID](#section/Supported-Models)
                    url:
                      type: string
                      description: The URL of where to POST the Webhook. Note that only URLs using the `https` protocol will be accepted.
                  required:
                  - url
                  - model
                  - fields
        required: false
