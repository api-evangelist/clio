        required: false
    delete:
      tags:
      - Tax Rate Configurations
      summary: Delete a single TaxRateConfiguration
      operationId: TaxRateConfiguration#destroy
      description: A TaxRateConfiguration can not be deleted if it is a system tax rate, has already been deleted, or is in use — set as an invoice default, used on one or more expenses, used on one or more expense categories, or used in one or more unpaid invoices.
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier for the TaxRateConfiguration.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    TaxRateConfiguration_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *TaxRateConfiguration*
        etag:
          type: string
          description: ETag for the *TaxRateConfiguration*
        name:
          type: string
          description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT)
        rate:
          type: number
          format: decimal
          description: The tax rate as a decimal between -1 and 1 (e.g. `0.13` for 13%)
        rate_as_percentage:
          type: number
          format: decimal
          description: The tax rate expressed as a percentage number (e.g. `13` for 13%)
        formatted_rate_as_percentage:
          type: string
          description: The tax rate formatted for display as a percentage string (e.g. `13%`)
        country:
          type: string
          description: The country this *TaxRateConfiguration* applies to
        region:
          type: string
          description: The region (state/province) this *TaxRateConfiguration* applies to, if any
        is_system:
          type: boolean
          description: Whether this *TaxRateConfiguration* is a system-managed entry (e.g. `Do not apply tax`, `Tax exempt`). System entries cannot be modified or deleted.
        active:
          type: boolean
          description: Whether this *TaxRateConfiguration* is active (not soft-deleted)
        created_at:
          type: string
          format: date-time
          description: The time the *TaxRateConfiguration* was created (as a ISO-8601 timestamp)
        updated_at:
          type: string
          format: date-time
          description: The time the *TaxRateConfiguration* was last updated (as a ISO-8601 timestamp)
    TaxRateConfiguration_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/TaxRateConfiguration'
    TaxRateConfiguration_List:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: TaxRateConfiguration List Response
          items:
            $ref: '#/components/schemas/TaxRateConfiguration'
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    TaxRateConfiguration:
      allOf:
      - $ref: '#/components/schemas/TaxRateConfiguration_base'
      - type: object
        properties: {}
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
