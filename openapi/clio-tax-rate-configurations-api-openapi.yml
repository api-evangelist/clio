components:
  schemas:
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    TaxRateConfiguration_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/TaxRateConfiguration'
    TaxRateConfiguration_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *TaxRateConfiguration*
        etag:
          type: string
          description: ETag for the *TaxRateConfiguration*
        name:
          type: string
          description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT)
        rate:
          type: number
          format: decimal
          description: The tax rate as a decimal between -1 and 1 (e.g. `0.13` for 13%)
        rate_as_percentage:
          type: number
          format: decimal
          description: The tax rate expressed as a percentage number (e.g. `13` for 13%)
        formatted_rate_as_percentage:
          type: string
          description: The tax rate formatted for display as a percentage string (e.g. `13%`)
        country:
          type: string
          description: The country this *TaxRateConfiguration* applies to
        region:
          type: string
          description: The region (state/province) this *TaxRateConfiguration* applies to, if any
        is_system:
          type: boolean
          description: Whether this *TaxRateConfiguration* is a system-managed entry (e.g. `Do not apply tax`, `Tax exempt`). System entries cannot be modified or deleted.
        active:
          type: boolean
          description: Whether this *TaxRateConfiguration* is active (not soft-deleted)
        created_at:
          type: string
          format: date-time
          description: The time the *TaxRateConfiguration* was created (as a ISO-8601 timestamp)
        updated_at:
          type: string
          format: date-time
          description: The time the *TaxRateConfiguration* was last updated (as a ISO-8601 timestamp)
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    TaxRateConfiguration:
      allOf:
      - $ref: '#/components/schemas/TaxRateConfiguration_base'
      - type: object
        properties: {}
    TaxRateConfiguration_List:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: TaxRateConfiguration List Response
          items:
            $ref: '#/components/schemas/TaxRateConfiguration'
