        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Precondition Failed
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Tax Rate Configurations
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    country:
                      type: string
                      description: The country this *TaxRateConfiguration* applies to.
                    name:
                      type: string
                      description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT).
                    rate:
                      type: number
                      format: decimal
                      description: The tax rate as a decimal between -1 and 1 (e.g. `0.13` for 13%).
                    region:
                      type: string
                      description: The region (state/province) this *TaxRateConfiguration* applies to, if any.
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    country:
                      type: string
                      description: The country this *TaxRateConfiguration* applies to.
                    name:
                      type: string
                      description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT).
                    rate:
