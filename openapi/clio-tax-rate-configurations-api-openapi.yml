tags:
- name: Tax Rate Configurations
  description: ''
paths:
  /tax_rate_configurations.json:
    get:
      tags:
      - Tax Rate Configurations
      summary: Return the data for all TaxRateConfigurations
      operationId: TaxRateConfiguration#index
      description: Outlines the parameters, optional and required, used when requesting the data for all TaxRateConfigurations
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: created_since
        in: query
        description: Filter TaxRateConfiguration records to those having the `created_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: ids[]
        in: query
        description: Filter TaxRateConfiguration records to those having the specified unique identifiers.
        required: false
        schema:
          type: integer
          format: int64
      - name: include_system
        in: query
        description: When true (default), system tax rates ("Do not apply tax", "Tax exempt") are included in the response. Pass include_system=false to exclude them.
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: 'A limit on the number of TaxRateConfiguration records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        description: 'Orders the TaxRateConfiguration records by the given field. Default: `id(asc)`.'
        required: false
        schema:
          type: string
          enum:
          - id(asc)
          - id(desc)
          - name(asc)
          - name(desc)
          - rate(asc)
          - rate(desc)
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: updated_since
        in: query
        description: Filter TaxRateConfiguration records to those having the `updated_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ok
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/TaxRateConfiguration_List'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Tax Rate Configurations
      summary: Create a new TaxRateConfiguration
      operationId: TaxRateConfiguration#create
      description: 'The `tax_authority` field is only accepted on this endpoint for accounts whose country has tax authorities defined and the `tax_authority` feature enabled.


        When available, `tax_authority` is **required** — omitting it returns 422 with the message "tax_authority is required for accounts with tax authority support enabled."


        When not available, supplying `tax_authority` returns 422 with the message "tax_authority is only available for accounts with tax authority support enabled."


        When available but the value isn''t one of the account''s country''s own authorities, the request returns 422 with the message "tax_authority is not a supported value for this account''s country."


        `tax_authority` is a create-only field and is ignored on PATCH.'
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/TaxRateConfiguration_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Tax Rate Configurations
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    country:
                      type: string
                      description: The country this *TaxRateConfiguration* applies to.
                    name:
                      type: string
                      description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT).
                    rate:
                      type: number
                      format: decimal
                      description: The tax rate as a decimal between -1 and 1 (e.g. `0.13` for 13%).
                    region:
                      type: string
                      description: The region (state/province) this *TaxRateConfiguration* applies to, if any.
                    tax_authority:
                      type: string
                      enum:
                      - canada_revenue_agency_cra
                      - revenu_quebec
                      - british_columbia_ministry_of_finance
                      - manitoba_department_of_finance
                      - saskatchewan_ministry_of_finance
                      - none
                      - other
                      description: 'The tax authority that administers this rate. Only accepted for Canadian accounts with tax-authority support enabled, where it is required. Allowed values: ```canada_revenue_agency_cra```, ```revenu_quebec```, ```british_columbia_ministry_of_finance```, ```manitoba_department_of_finance```, ```saskatchewan_ministry_of_finance```, ```none```, ```other```.'
                  required:
                  - name
                  - rate
                  - country
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    country:
                      type: string
                      description: The country this *TaxRateConfiguration* applies to.
                    name:
                      type: string
                      description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT).
                    rate:
                      type: number
                      format: decimal
                      description: The tax rate as a decimal between -1 and 1 (e.g. `0.13` for 13%).
                    region:
                      type: string
                      description: The region (state/province) this *TaxRateConfiguration* applies to, if any.
                    tax_authority:
                      type: string
                      enum:
                      - canada_revenue_agency_cra
                      - revenu_quebec
                      - british_columbia_ministry_of_finance
                      - manitoba_department_of_finance
                      - saskatchewan_ministry_of_finance
                      - none
                      - other
                      description: 'The tax authority that administers this rate. Only accepted for Canadian accounts with tax-authority support enabled, where it is required. Allowed values: ```canada_revenue_agency_cra```, ```revenu_quebec```, ```british_columbia_ministry_of_finance```, ```manitoba_department_of_finance```, ```saskatchewan_ministry_of_finance```, ```none```, ```other```.'
                  required:
                  - name
                  - rate
                  - country
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    country:
                      type: string
                      description: The country this *TaxRateConfiguration* applies to.
                    name:
                      type: string
                      description: The human-readable name of the *TaxRateConfiguration* (e.g. HST, GST, VAT).
                    rate:
                      type: number
                      format: decimal
                      description: The tax rate as a decimal between -1 and 1 (e.g. `0.13` for 13%).
                    region:
                      type: string
                      description: The region (state/province) this *TaxRateConfiguration* applies to, if any.
                    tax_authority:
                      type: string
                      enum:
                      - canada_revenue_agency_cra
                      - revenu_quebec
                      - british_columbia_ministry_of_finance
                      - manitoba_department_of_finance
                      - saskatchewan_ministry_of_finance
                      - none
                      - other
                      description: 'The tax authority that administers this rate. Only accepted for Canadian accounts with tax-authority support enabled, where it is required. Allowed values: ```canada_revenue_agency_cra```, ```revenu_quebec```, ```british_columbia_ministry_of_finance```, ```manitoba_department_of_finance```, ```saskatchewan_ministry_of_finance```, ```none```, ```other```.'
                  required:
                  - name
                  - rate
                  - country
        required: false
