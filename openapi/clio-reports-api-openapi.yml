components:
  schemas:
    Report_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *Report*
        etag:
          type: string
          description: ETag for the *Report*
        name:
          type: string
          description: A specified name for the report
        state:
          type: string
          enum:
          - not_started
          - queued
          - in_progress
          - failed
          - completed
          - empty
          description: The current state of the report
        kind:
          type: string
          enum:
          - accounts_receivable
          - accounts_receivable_aging
          - bank_account_activity
          - billing_history
