          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Activity Descriptions
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency:
                      type: object
                      description: Currency of the ActivityDescription.
                    default:
                      type: boolean
                      description: Whether or not this should be the API User's default ActivityDescription.
                    groups:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                            description: The unique identifier for a single Group associated with the ActivityDescription. The keyword `null` is not valid for this field.
                    name:
                      type: string
                      description: A detailed description of the ActivityDescription.
                    rate:
                      type: object
                      properties:
                        amount:
                          type: number
                          format: double
                          default: 0
                          description: The rate of the ActivityDescription. This is ignored for 'User' rates.
                        non_billable_amount:
                          type: number
                          format: double
                          default: 0
                          description: The non billable rate of the ActivityDescription. This is ignored for 'User' rates.
                        type:
                          type: string
                          enum:
                          - User
                          - FlatRate
                          - Custom
                          description: What kind of rate it will be.
                    visible_to_co_counsel:
                      type: boolean
                      description: Whether or not co counsels on the account can see this ActivityDescription.
                  required:
                  - name
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency:
                      type: object
                      description: Currency of the ActivityDescription.
                    default:
                      type: boolean
                      description: Whether or not this should be the API User's default ActivityDescription.
                    groups:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                            description: The unique identifier for a single Group associated with the ActivityDescription. The keyword `null` is not valid for this field.
                    name:
                      type: string
                      description: A detailed description of the ActivityDescription.
                    rate:
                      type: object
                      properties:
                        amount:
                          type: number
                          format: double
                          default: 0
                          description: The rate of the ActivityDescription. This is ignored for 'User' rates.
                        non_billable_amount:
                          type: number
                          format: double
                          default: 0
                          description: The non billable rate of the ActivityDescription. This is ignored for 'User' rates.
                        type:
                          type: string
                          enum:
                          - User
                          - FlatRate
                          - Custom
                          description: What kind of rate it will be.
                    visible_to_co_counsel:
                      type: boolean
                      description: Whether or not co counsels on the account can see this ActivityDescription.
                  required:
                  - name
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    currency:
                      type: object
                      description: Currency of the ActivityDescription.
                    default:
                      type: boolean
                      description: Whether or not this should be the API User's default ActivityDescription.
                    groups:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            format: int64
                            description: The unique identifier for a single Group associated with the ActivityDescription. The keyword `null` is not valid for this field.
                    name:
                      type: string
                      description: A detailed description of the ActivityDescription.
                    rate:
                      type: object
                      properties:
                        amount:
                          type: number
                          format: double
                          default: 0
                          description: The rate of the ActivityDescription. This is ignored for 'User' rates.
                        non_billable_amount:
                          type: number
                          format: double
                          default: 0
                          description: The non billable rate of the ActivityDescription. This is ignored for 'User' rates.
                        type:
                          type: string
                          enum:
                          - User
                          - FlatRate
                          - Custom
                          description: What kind of rate it will be.
                    visible_to_co_counsel:
                      type: boolean
                      description: Whether or not co counsels on the account can see this ActivityDescription.
                  required:
                  - name
        required: false
