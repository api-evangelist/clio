components:
  schemas:
    ErrorDetail:
      type: object
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Unique name for this error
        message:
          type: string
          description: Detailed message about the error
    SafeCustodyRecord_base:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: The time the *SafeCustodyRecord* was created (as a ISO-8601 timestamp)
        date:
          type: string
          format: date
          description: The date shown on the physical document itself (as an ISO-8601 date)
        description:
          type: string
          description: Free-text description of the *SafeCustodyRecord*
        document_type_name:
          type: string
          description: The human-readable type of the physical document
        etag:
          type: string
          description: ETag for the *SafeCustodyRecord*
        id:
          type: integer
          format: int64
          description: Unique identifier for the *SafeCustodyRecord*
        stored_on:
          type: string
          format: date
          description: The date the document was received or stored (as an ISO-8601 date)
        title:
          type: string
          description: The title of the *SafeCustodyRecord*
        updated_at:
          type: string
          format: date-time
          description: The time the *SafeCustodyRecord* was last updated (as a ISO-8601 timestamp)
    SafeCustodyRecord:
      allOf:
      - $ref: '#/components/schemas/SafeCustodyRecord_base'
      - type: object
        properties:
          packet:
            $ref: '#/components/schemas/SafeCustodyRecord_SafeCustodyPacket_base'
            description: SafeCustodyPacket
    SafeCustodyRecord_SafeCustodyPacket_base:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the *SafeCustodyPacket*
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    SafeCustodyRecordState_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/SafeCustodyRecordState'
    SafeCustodyRecord_List:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: SafeCustodyRecord List Response
          items:
            $ref: '#/components/schemas/SafeCustodyRecord'
    SafeCustodyRecordState_base:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: The time the *SafeCustodyRecordState* was created (as a ISO-8601 timestamp)
        date:
          type: string
          format: date
          description: The date shown on the physical document itself (as an ISO-8601 date)
        etag:
          type: string
          description: ETag for the *SafeCustodyRecordState*
        id:
          type: integer
          format: int64
          description: Unique identifier for the *SafeCustodyRecordState*
        reason:
          type: string
          description: The reason recorded against the custody state change
        state:
          type: string
          description: The current custody state of the record (held, temporarily_removed or removed)
        updated_at:
          type: string
          format: date-time
          description: The time the *SafeCustodyRecordState* was last updated (as a ISO-8601 timestamp)
    SafeCustodyRecord_Show:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/SafeCustodyRecord'
    SafeCustodyRecordState:
      allOf:
      - $ref: '#/components/schemas/SafeCustodyRecordState_base'
      - type: object
        properties: {}
