paths:
  /safe_custody/records/{id}/state_changes.json:
    post:
      tags:
      - Safe Custody Records
      summary: Transition the custody state of a SafeCustodyRecord
      operationId: SafeCustodyRecord#state_changes
      description: 'Records a custody state transition for the record (`held`, `temporarily_removed` or `removed`) as a new SafeCustodyRecordState.

        Transitions are validated against the record''s state machine; an unsupported transition returns `422`.

        Records cannot be moved between packets.'
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: The unique identifier for the SafeCustodyRecord.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '201':
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/SafeCustodyRecordState_Show'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        description: Request Body for Records
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    actor_id:
                      type: integer
                      format: int64
                      description: The unique identifier of the actor (a user or contact) associated with the state change.
                    actor_type:
                      type: integer
                      format: int32
                      enum:
                      - 1
                      - 2
                      description: 'The type of actor: 1 for a user, 2 for a contact.'
                    date:
                      type: string
                      format: date
                      description: The date of the state change (ISO-8601). Defaults to the record's stored_on date.
                    reason:
                      type: string
                      description: The reason for the state change.
                    state:
                      type: string
                      enum:
                      - held
                      - temporarily_removed
                      - removed
                      description: The custody state to transition to.
                  required:
                  - state
                  - actor_id
                  - actor_type
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    actor_id:
                      type: integer
                      format: int64
                      description: The unique identifier of the actor (a user or contact) associated with the state change.
                    actor_type:
                      type: integer
                      format: int32
                      enum:
                      - 1
                      - 2
                      description: 'The type of actor: 1 for a user, 2 for a contact.'
                    date:
                      type: string
                      format: date
                      description: The date of the state change (ISO-8601). Defaults to the record's stored_on date.
                    reason:
                      type: string
                      description: The reason for the state change.
                    state:
                      type: string
                      enum:
                      - held
                      - temporarily_removed
                      - removed
                      description: The custody state to transition to.
                  required:
                  - state
                  - actor_id
                  - actor_type
          multipart/form-data:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  properties:
                    actor_id:
                      type: integer
                      format: int64
                      description: The unique identifier of the actor (a user or contact) associated with the state change.
                    actor_type:
                      type: integer
                      format: int32
                      enum:
                      - 1
                      - 2
                      description: 'The type of actor: 1 for a user, 2 for a contact.'
                    date:
                      type: string
                      format: date
                      description: The date of the state change (ISO-8601). Defaults to the record's stored_on date.
                    reason:
                      type: string
                      description: The reason for the state change.
                    state:
                      type: string
                      enum:
                      - held
                      - temporarily_removed
                      - removed
                      description: The custody state to transition to.
                  required:
                  - state
                  - actor_id
                  - actor_type
        required: false
  /safe_custody/records.json:
    get:
      tags:
      - Safe Custody Records
      summary: Return the data for all SafeCustodyRecords
      operationId: SafeCustodyRecord#index
      description: Outlines the parameters, optional and required, used when requesting the data for all SafeCustodyRecords
      parameters:
      - name: X-API-VERSION
        in: header
        description: 'The [API minor version](#section/Minor-Versions). Default: latest version.'
        required: false
        schema:
          type: string
      - name: created_since
        in: query
        description: Filter SafeCustodyRecord records to those having the `created_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
          type: string
          format: date-time
      - name: fields
        in: query
        description: The fields to be returned. See response samples for what fields are available. For more information see the [fields section](#section/Fields).
        required: false
        schema:
          type: string
      - name: ids[]
        in: query
        description: Filter SafeCustodyRecord records to those having the specified unique identifiers.
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 'A limit on the number of SafeCustodyRecord records to be returned. Limit can range between 1 and 200. Default: `200`.'
        required: false
        schema:
          type: integer
          format: int32
      - name: packet_id
        in: query
        description: Filter SafeCustodyRecord records to those belonging to the packet with the given ID.
        required: false
        schema:
          type: integer
          format: int64
      - name: page_token
        in: query
        description: A token specifying which page to return.
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: Filter SafeCustodyRecord records by custody state (`held`, `temporarily_removed` or `removed`). Use `all` to include every state.
        required: false
        schema:
          type: string
          enum:
          - held
          - temporarily_removed
          - removed
      - name: updated_since
        in: query
        description: Filter SafeCustodyRecord records to those having the `updated_at` field after a specific time. (Expects an ISO-8601 timestamp).
        required: false
        schema:
