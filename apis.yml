aid: clio
name: Clio
description: Clio is a cloud-based legal practice management platform used by law
  firms for matter management, contacts, calendaring, time and billing, trust accounting,
  document management, tasks, and client communications. The Clio Manage API is a
  REST/JSON API at app.clio.com/api/v4 that uses OAuth 2.0 (authorization code flow)
  for authentication and exposes the full data model behind Clio Manage, with regional
  endpoints for the U.S., Canada, EU/UK, and Australia. Webhooks deliver near real-time
  event notifications, and the Clio App Directory hosts certified third-party integrations.
type: Index
