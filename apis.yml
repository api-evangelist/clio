- aid: clio:clio-calendar-entries-api
  name: Clio Calendar Entries API
  description: >-
    Calendar Entries are used to track appointments or deadlines. Users can view Calendar Entries on any
    Calendar that they have “Viewer” or “Editor” permission for. Users can create Calendar Entries on
    any Calendar that they have “Editor” permission for.

    ### Only supports dates on or after January 01 1900 00:00 UTC

    * If you attempt to create a date before 1900, the year of that date will be pulled forward to 1900
    before it's persisted.


    ### Calendar Update/Deletion Best Practices

    * Prior to updating or deleting a calendar entry, check for recurrence.

    * If the recurrence_rule parameter is not equal to `null`, offer the following 3 options for the update/deletion,
    as well as the note:
        1. Only this instance: Update/Delete this event, but leave all future events unchanged.
        2. All following: Updates/Deletes this event and all the future events.
        3. All events in the series: Updates/Deletes all events in the series.
        * Note: If you've modified any future events in this series, those edits will be lost once you
    make this change.

    [Support Link](https://help.clio.com/hc/en-us/articles/9289905071387-Calendar-Events)
  humanURL: https://docs.developers.clio.com/
  baseURL: https://app.clio.com/api/v4
