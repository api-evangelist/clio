    ### Options

    When creating a Report Preset, the options sent in the request body is dependent on the report kind.


    Check out the sample request to create a Report Preset for the Billing History web report for the
    current year and grouped by client.


    ```

    Request
      POST /api/v4/report_presets.json
      {
        data:
        { name: "Current Yr Billing",
          kind: "billing_history",
          options: {
            date_range: "year",
            format: "html",
            group_by: "client",
            start_date: null,
            end_date: null,
            kind: "billing_history"
          },
          format: "html"
        }
      }
    ```
