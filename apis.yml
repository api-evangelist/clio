- aid: clio:clio-activities-api
  name: Clio Activities API
  description: >-
    Activities (Time Entries and Expense Entries) track work done at a firm. Activities are recorded in
    Clio and then posted on bills to clients.


    Time Entries can be either be hourly-billable or flat-rate. An hourly-billable Time Entry is valued
    at the billing rate multiplied by the time entered. Examples could be a phone call, or a research
    session. A flat-rate Time Entry has a set value. Examples could be a visa application, or a contract
    review.


    Expenses are reimbursable costs the firm pays on behalf of a client (for example, postage, copy fees,
    etc.).


    [Support Link](https://help.clio.com/hc/en-us/sections/9036198517915-Activities)


    [Activities in Clio](http://app.clio.com/activities)
